name: Create Tag on Push

on:
  push:
    branches:
      - main  # Sostituisci con il tuo branch principale se diverso

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Check commit message
        id: check_message
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"exec-release"* ]]; then
            echo "Tagging commit because 'exec-release' was found in the message."
            echo "tag=true" >> $GITHUB_ENV
          else
            echo "No tagging needed."
            echo "tag=false" >> $GITHUB_ENV
          fi

      - name: Configure Git identity
        run: |
          git config --global user.name "TaggingAutomatico"
          git config --global user.email "your-email@example.com"	  
      - name: Get latest tag
        run: |
          latest_tag=$(git describe --tags --abbrev=0)
          echo "Latest tag: $latest_tag"

      - name: Extract version number
        run: |
          version=$(echo "$latest_tag" | cut -d'-' -f3)
          echo "Version: $version"

      - name: Increment version number
        run: |
          new_version=$((version + 1))
          echo "New version: $new_version"

      - name: Create Tag
        if: env.tag == 'true'
        run: |
          git tag -a "PRDGCP-$(date +%Y%m%d)-${new_version}" -m "Tag creato automaticamente"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/effedetto/oauth-authorization-server.git "PRDGCP-$(date +%Y%m%d)-${new_version}"
