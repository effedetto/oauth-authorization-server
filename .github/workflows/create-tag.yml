name: Create Tag on Push

on:
  push:
    branches:
      - main  # Sostituisci con il tuo branch principale se diverso

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Check commit message
        id: check_message
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"exec-release"* ]]; then
            echo "Tagging commit because 'exec-release' was found in the message."
            echo "tag=true" >> $GITHUB_ENV
          else
            echo "No tagging needed."
            echo "tag=false" >> $GITHUB_ENV
          fi  # Add this missing line

      - name: Configure Git identity
        run: |
          git config --global user.name "TaggingAutomatico"
          git config --global user.email "your-email@example.com"
      - name: Fetch tags
        run: git fetch --tags         
      - name: List existing tags
        run: git tag
      - name: Get latest tag
        run: |
          latest_tag=$(git for-each-ref --sort=creatordate --format '%(refname:short)' refs/tags | tail -n 1)
          echo "Latest tag: $latest_tag"
          echo "latest_tag=$latest_tag" >> $GITHUB_ENV

      - name: Extract version number
        run: |
          version=$(echo "${{ env.latest_tag }}" | grep -oP '\d+$')
          if [ -z "$version" ]; then version=0; fi
          echo "Version: $version"
          echo "version=$version" >> $GITHUB_ENV

      - name: Increment version number
        run: |
          new_version=$((version + 1))
          echo "New version: $new_version"
          echo "new_version=$new_version" >> $GITHUB_ENV

      - name: Create Tag
        if: env.tag == 'true'
        run: |
          git tag -a "PRDGCP-$(date +%Y%m%d)-${{ env.new_version }}" -m "Tag creato automaticamente"
          git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/effedetto/oauth-authorization-server.git "PRDGCP-$(date +%Y%m%d)-${{ env.new_version }}"
